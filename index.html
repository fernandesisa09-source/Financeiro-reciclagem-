.fin-stat.amber{background:linear-gradient(135deg,#fffaf0,#fff7e5);border-color:#f8ebc9}.fin-stat.amber .fin-value{color:#c76b00}
.fin-stat.blue{background:linear-gradient(135deg,#f1f7ff,#edf4ff);border-color:#dbeafe}.fin-stat.blue .fin-value{color:#174ea6}
.fin-tools{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:12px 0}.fin-tools-left,.fin-tools-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.fin-search{min-width:220px;max-width:360px}

function imprimirItem(table,id){
 const lista = cache[table] || (table==="ordens_servico" ? (cache.ordens||[]) : []);
 const row = lista.find(x=>String(x.id)===String(id));
 if(!row)return alert("Item não encontrado.");
 const escp=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
 const find=(arr,id,key)=>((arr||[]).find(x=>x.id===id)||{})[key]||"";
 const fields=[];
 const add=(n,v)=>{if(v!==null&&v!==undefined&&String(v)!=="")fields.push("<p><b>"+escp(n)+":</b> "+escp(v)+"</p>");};
 let title="Registro";
 if(table==="ordens_servico"){title="Ordem de Serviço";add("Número",row.numero);add("Cliente",find(cache.clientes,row.cliente_id,"nome"));add("Caçamba",find(cache.cacambas,row.cacamba_id,"numero"));add("Caminhão",find(cache.caminhoes,row.caminhao_id,"identificacao"));add("Placa",find(cache.caminhoes,row.caminhao_id,"placa"));add("Motorista",find(cache.motoristas,row.motorista_id,"nome"));add("Endereço",row.endereco);add("Material",row.material);add("Data de entrega",osDataBRPrint(row.data_entrega));add("Retirada prevista",osDataBRPrint(row.data_retirada_prevista));add("Status",row.status);add("Observações",row.observacoes);}
 else if(table==="cacambas"){title="Ficha da Caçamba";add("Número",row.numero);add("Status",row.status);add("Estado",row.estado||"Não informado");add("Cliente",find(cache.clientes,row.cliente_id,"nome"));add("Caminhão",find(cache.caminhoes,row.caminhao_id,"identificacao"));add("Motorista",find(cache.motoristas,row.motorista_id,"nome"));add("Material",row.material);add("Endereço",row.endereco_atual);add("Pátio",row.patio);add("Data de colocação",row.data_colocacao);add("Observações",row.observacoes);}
 else if(table==="clientes"){title="Ficha do Cliente";add("Nome",row.nome);add("Responsável",row.responsavel);add("Telefone",row.telefone);add("E-mail",row.email);add("Endereço",row.endereco);add("Número",row.numero);add("Bairro",row.bairro);add("Cidade",row.cidade);add("UF",row.uf);add("CEP",row.cep);add("Caçambas",(cache.cacambas||[]).filter(c=>c.cliente_id===row.id).length);add("Observações",row.observacoes);}
 else if(table==="motoristas"){title="Ficha do Motorista";add("Nome",row.nome);add("Telefone",row.telefone);add("CNH",row.cnh);add("Status",row.status);add("Observações",row.observacoes);}
 else if(table==="caminhoes"){title="Ficha do Caminhão";add("Identificação",row.identificacao);add("Placa",row.placa);add("Motorista",find(cache.motoristas,row.motorista_id,"nome"));add("Status",row.status);add("Observações",row.observacoes);}
 else if(table==="movimentacoes"){title="Movimentação";add("Tipo",row.tipo);add("Data",row.data);add("Caçamba",find(cache.cacambas,row.cacamba_id,"numero"));add("Cliente",find(cache.clientes,row.cliente_id,"nome"));add("Caminhão",find(cache.caminhoes,row.caminhao_id,"identificacao"));add("Motorista",find(cache.motoristas,row.motorista_id,"nome"));add("Endereço",row.endereco);add("Material",row.material);add("Observações",row.observacoes);}
 else if(table==="manutencoes"){title="Manutenção";add("Caçamba",find(cache.cacambas,row.cacamba_id,"numero"));add("Data",row.data);add("Problema",row.problema);add("Custo",row.custo);add("Status",row.status);add("Observações",row.observacoes);}
 else return;
 const w=window.open("","_blank");
 if(!w)return alert("Permita pop-ups para imprimir.");
 w.document.write("<!doctype html><html><head><meta charset='utf-8'><title>"+escp(title)+"</title><style>body{font-family:Arial;margin:35px;color:#333}h1{color:#55358a;border-bottom:3px solid #0a9a4a;padding-bottom:10px}p{padding:8px 0;border-bottom:1px solid #ddd}small{color:#777}</style></head><body><h1>"+escp(title)+"</h1>"+fields.join("")+"<small>Sucatas Analice</small></body></html>");
 w.document.close(); w.focus(); setTimeout(()=>w.print(),300);
}

function show(page){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
 const alvo=$(page);
 if(!alvo)return;
 alvo.classList.add("active"); document.querySelector(`nav button[data-page="${page}"]`)?.classList.add("active");
 try{
   const r=renderPage(page);
   if(r&&typeof r.catch==="function")r.catch(e=>{console.error("Erro ao abrir aba",page,e);alvo.innerHTML=`<div class="card"><h2>⚠️ Não foi possível carregar esta aba</h2><p class="small">O sistema continua funcionando. Tente novamente em alguns segundos.</p><button class="btn primary" onclick="show('${page}')">🔄 Tentar novamente</button></div>`;});
 }catch(e){
   console.error("Erro ao abrir aba",page,e);
   alvo.innerHTML=`<div class="card"><h2>⚠️ Não foi possível carregar esta aba</h2><p class="small">Tente novamente.</p><button class="btn primary" onclick="show('${page}')">🔄 Tentar novamente</button></div>`;
 }
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.page));

async function login(){
 try{
  const email=val("email"), password=$("password").value;
  if(!email||!password)return msg("loginMsg","Informe e-mail e senha.");
  msg("loginMsg","Entrando...",false);
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error)return msg("loginMsg",error.message);
  await startApp();
 }catch(e){
  console.error(e);
  msg("loginMsg","Não foi possível entrar. Verifique sua conexão e tente novamente.");
 }
}
async function forgotPassword(){
 const email=val("email");
 if(!email)return msg("loginMsg","Digite seu e-mail para receber o link de redefinição da senha.");
 const redirectTo=window.location.origin+window.location.pathname;
 const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});
 if(error)return msg("loginMsg",error.message);
 msg("loginMsg","E-mail enviado! Verifique sua caixa de entrada e siga o link para criar uma nova senha.",true);
}
async function updatePassword(){
 const password=$("newPassword").value, confirm=$("confirmPassword").value;
 if(password.length<6)return msg("resetMsg","A nova senha deve ter pelo menos 6 caracteres.");
 if(password!==confirm)return msg("resetMsg","As senhas não são iguais.");
 const {error}=await sb.auth.updateUser({password});
 if(error)return msg("resetMsg",error.message);
 msg("resetMsg","Senha alterada com sucesso! Agora você pode entrar com sua nova senha.",true);
 setTimeout(()=>location.reload(),1200);
}
function showResetPassword(){

function sortRecords(table,arr){
 const a=[...(arr||[])];
 const nameField={clientes:"nome",motoristas:"nome",caminhoes:"identificacao"}[table];
 if(table==="cacambas" || table==="ordens_servico"){
   const field=table==="cacambas"?"numero":"numero";
   return a.sort((x,y)=>{
     const nx=parseFloat(String(x[field]??"").replace(/[^0-9.-]/g,""));
     const ny=parseFloat(String(y[field]??"").replace(/[^0-9.-]/g,""));
     if(Number.isFinite(nx)&&Number.isFinite(ny)&&nx!==ny)return nx-ny;
     return String(x[field]??"").localeCompare(String(y[field]??""),"pt-BR",{numeric:true,sensitivity:"base"});
   });
 }
 if(nameField)return a.sort((x,y)=>String(x[nameField]??"").localeCompare(String(y[nameField]??""),"pt-BR",{numeric:true,sensitivity:"base"}));
 if(table==="movimentacoes" || table==="manutencoes")return a.sort((x,y)=>String(y.data??y.created_at??"").localeCompare(String(x.data??x.created_at??"")));
 return a;
}

function dataBR(v){
  if(!v) return "";
  const s=String(v);
  const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[3]}/${m[2]}/${m[1]}`;
  const d=new Date(s);
  if(isNaN(d.getTime())) return s;
  return d.toLocaleDateString("pt-BR");
}
function hojeBR(){ return dataBR(new Date().toISOString()); }

const AD_KEY="sucatas_analice_adiantamentos_v1";
let adCloud=[];
let adCloudReady=false;

function adSaldo(a){
 return Math.max(0,Number(a.valor||0)-(a.abatimentos||[]).reduce((s,x)=>s+Number(x.valor||0),0));
}
function adR$(v){
 return Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}
function adEsc(v){
 return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
}
function adNumeroBR(v){
 let s=String(v??"").replace(/\D/g,"");
 if(!s)return "";
 s=(Number(s)/100).toFixed(2);
 return s.replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g,".");
}
// Formata um número monetário já convertido, sem tratá-lo como centavos.
function financeiroNumeroBR(v){
 const n=Number(v);
 return Number.isFinite(n)?n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}):"0,00";
}
function adParseBR(v){
 const s=String(v??"").trim();
 if(!s)return 0;
 return Number(s.replace(/\./g,"").replace(",","."));
}
function adDataBR(v){
 if(!v)return "";
 const s=String(v);
 const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
 if(m)return `${m[3]}/${m[2]}/${m[1]}`;
 return s;
}
function adLocal(){
 try{return JSON.parse(localStorage.getItem(AD_KEY)||"[]")}catch(e){return[]}
}
async function adLoad(force=false){
 if(adCloudReady&&!force)return adCloud;
 const {data,error}=await sb.from("adiantamentos").select("*").order("data",{ascending:false});
 if(error)throw error;
 adCloud=data||[];
 adCloudReady=true;

 // Sincroniza registros antigos que ainda estejam somente neste aparelho.
 // Junta os registros locais com os que já existem na nuvem.
 const antigos=adLocal();
 if(antigos.length){
   const rows=antigos.map(a=>({
     id:a.id||crypto.randomUUID(),
     pessoa:a.pessoa,
     data:a.data,
     valor:Number(a.valor||0),
     observacoes:a.observacoes||"",
     abatimentos:a.abatimentos||[]
   }));
   const idsNuvem=new Set(adCloud.map(x=>String(x.id)));
   const novosLocais=rows.filter(x=>!idsNuvem.has(String(x.id)));
   if(novosLocais.length){
     const ins=await sb.from("adiantamentos").upsert(novosLocais,{onConflict:"id"});
     if(ins.error)throw ins.error;
     adCloud=[...adCloud,...novosLocais];
   }
   localStorage.removeItem(AD_KEY);
 }
 adCloud=adCloud.sort((a,b)=>String(b.data||"").localeCompare(String(a.data||"")));
 adCloudReady=true;
 return adCloud;
}

async function adComplementarExistente(){

 }).eq("id",a.id);

 if(error)return alert("Não foi possível acrescentar o valor: "+error.message);

 await adRender();
 alert("Valor acrescentado com sucesso!\nNovo total do adiantamento: "+adR$(novo));
}

function pesoNum(v){const s=String(v??"").trim().replace(/\./g,"").replace(",","."); const n=parseFloat(s); return Number.isFinite(n)?n:0}
function moedaNum(v){return pesoNum(v)}
function parseBR(v){
 const s=String(v??"").trim().replace(/R\$\s?/gi,"").replace(/\s/g,"");
 if(!s)return 0;
 // Aceita tanto o formato brasileiro (51,99 / 1.251,99)
 // quanto o formato com ponto decimal (51.99 / 1251.99).
 const lastComma=s.lastIndexOf(","), lastDot=s.lastIndexOf(".");
 let n;
 if(lastComma>=0 && lastDot>=0){
   n = lastComma>lastDot ? Number(s.replace(/\./g,"").replace(",",".")) : Number(s.replace(/,/g,""));
 }else if(lastComma>=0){
   n = Number(s.replace(/\./g,"").replace(",","."));
 }else if(lastDot>=0){
   const parts=s.split(".");
   n = parts.length===2 && parts[1].length<=2 ? Number(s) : Number(s.replace(/\./g,""));
 }else n=Number(s);
 return Number.isFinite(n)?n:0;
}
function brNum(n,d=2){return Number(n||0).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d})}
function produtoSelecionado(){const id=$("pprod")?.value; return produtosLoad().find(x=>String(x.id)===String(id))||null}
function produtoSelecionar(){const x=produtoSelecionado(); if(x){if($("pmat"))$("pmat").value=x.nome||"";pesagemCalcular()}}
function normalizarTipoOperacao(tipo){
 const t=String(tipo||"compra").trim().toLowerCase();
 return t==="venda"?"venda":t==="cacamba"||t==="caçamba"?"cacamba":"compra";
}
function tipoOperacaoLabel(tipo){
 const t=normalizarTipoOperacao(tipo);
 return t==="venda"?"VENDA":t==="cacamba"?"CAÇAMBAS":"COMPRA";
}
function pesagemLiquidoCalcular(entrada,saida,tipo){
 const e=Number(entrada||0), s=Number(saida||0);
 return normalizarTipoOperacao(tipo)==="venda" ? Math.abs(e-s) : e-s;
}
function pesagemModoAlterar(){
 const direta=$("pmode")?.value==="direta";
 if($("pe"))$("pe").value=""; if($("ps"))$("ps").value=""; if($("pliq"))$("pliq").value="";
 if($("pe"))$("pe").readOnly=direta; if($("ps"))$("ps").readOnly=direta; if($("pliq"))$("pliq").readOnly=!direta;
 if($("pentrada_box"))$("pentrada_box").style.display=direta?"none":"";
 if($("psaida_box"))$("psaida_box").style.display=direta?"none":"";
}
function pesagemCalcular(){
 const direta=$("pmode")?.value==="direta";
 const entrada=direta?0:pesoNum($("pe")?.value),saida=direta?0:pesoNum($("ps")?.value);
 const tipo=$("pmov")?.value||"compra";
 const liquido=direta?Math.max(0,pesoNum($("pliq")?.value)):Math.max(0,pesagemLiquidoCalcular(entrada,saida,tipo));
 if($("pliq")&&!direta)$("pliq").value=brNum(liquido);
 return {entrada,saida,liquido};
}

async function pesagemRender(){

 // Busca os valores do Financeiro para o balanceiro conseguir conferir quanto cada pesagem representa.

     const {data:fv}=await sb.from("financeiro_pesagens").select("pesagem_id,total,preco_kg,total_pago,status").in("pesagem_id",idsFinanceiro);
     (fv||[]).forEach(f=>{valorFinanceiroPorPesagem[String(f.pesagem_id)]=f;});

 }catch(e){console.warn("Valores do Financeiro na Pesagem:",e)}

   const f=valorFinanceiroPorPesagem[String(x.id)];
   if(f && (f.total!==null && f.total!==undefined) && Number(f.preco_kg||0)>0) return Number(f.total||0);
   const prod=produtosTela.find(m=>String(m.nome||"").trim().toLowerCase()===String(x.material||"").trim().toLowerCase());
   const preco=Number(prod?.preco||0);
   return preco>0?Number(x.liquido||0)*preco:0;
 };
 const abertas=lista.filter(x=>!x.fechada);

 const agrupar=(arr)=>{

     if(!grupos[k])grupos[k]={nome,items:[],grupoId:x.grupo_ticket_id||null,dataGrupo:dia};
     grupos[k].items.push(x);
   });
   Object.values(grupos).forEach(g=>g.items.sort((a,b)=>{const ca=new Date(a.created_at||0).getTime(),cb=new Date(b.created_at||0).getTime();return ca-cb || Number(a.numero_ticket||0)-Number(b.numero_ticket||0)}));
   return Object.values(grupos).sort((a,b)=>{const ca=new Date(a.items[0]?.created_at||0).getTime(),cb=new Date(b.items[0]?.created_at||0).getTime();return cb-ca || String(b.nome).localeCompare(String(a.nome))});
 };

 const agruparPorDia=(arr)=>{

   Object.values(mapa).forEach(g=>g.items.sort((a,b)=>{

async function pesagemSalvar(){
 const direta=$("pmode")?.value==="direta";
 const liquidoDireto=parseBR($("pliq")?.value||"0");
 const entrada=direta?liquidoDireto:parseBR($("pe")?.value||"0"), saida=direta?0:parseBR($("ps")?.value||"0");
 const hora_entrada=String($("phora_entrada")?.value||"").trim()||null, hora_saida=String($("phora_saida")?.value||"").trim()||null;
 const pessoa=String($("ppessoa")?.value||"").trim();
 const material=String($("pmat")?.value||"").trim();
 const data=String($("pdata")?.value||today());
 const tipo_movimento=normalizarTipoOperacao($("pmov")?.value||"compra");
 const fluxo_pesagem=String($("pfluxo")?.value||"");
 const liquido=direta?liquidoDireto:pesagemLiquidoCalcular(entrada,saida,tipo_movimento);
 if(!pessoa)return alert("Informe o nome da pessoa.");
 if(!material)return alert("Informe o material.");
 if(!fluxo_pesagem)return alert("Escolha o destino desta pesagem.");
 if(direta){if(liquidoDireto<=0)return alert("Informe um peso líquido válido.");}
 else {if(entrada<=0)return alert("Informe o peso de entrada.");if(saida<0)return alert("Informe um peso de saída válido.");}
 if(tipo_movimento==="compra" && entrada<saida)return alert("Na compra, o peso de entrada deve ser maior ou igual ao peso de saída. Se for uma venda, selecione Venda.");
 if(liquido<=0)return alert("O peso líquido precisa ser maior que zero.");
 const obs=String($("pobs")?.value||"").trim();
 const {data:userData,error:userError}=await sb.auth.getUser();
 if(userError||!userData?.user?.id)return alert("Sua sessão não está ativa. Faça login novamente para registrar a pesagem.");
 const row={user_id:userData.user.id,data,pessoa,material,entrada,saida,liquido,tipo_movimento,hora_entrada,hora_saida,observacoes:obs};
 await pesagemInserirComDestino(row,fluxo_pesagem,null);
}

async function pesagemInserirComDestino(row,fluxo,origem=null){
 const pessoa=String(row.pessoa||"").trim();
 const data=String(row.data||today());
 let sameDay=[];
 const qDia=await sb.from("pesagens").select("*").eq("data",data).order("created_at",{ascending:false});
 if(qDia.error)return alert("Não foi possível conferir os tickets do dia. A pesagem não foi registrada: "+qDia.error.message);
 sameDay=(qDia.data||[]).filter(x=>pesagemClienteNome(x).toLowerCase()===pessoa.toLowerCase());
 let grupoId=(origem?.fluxo_pesagem==="complementar"&&origem?.grupo_ticket_id)?origem.grupo_ticket_id:null;
 let relacionadas=[];
 if(grupoId){
   const qGrupo=await sb.from("pesagens").select("*").eq("grupo_ticket_id",grupoId).eq("fechada",false);
   if(qGrupo.error)return alert("Não foi possível carregar o grupo de complementação: "+qGrupo.error.message);
   relacionadas=qGrupo.data||[];
 }else if(fluxo==="complementar"){
   const qComp=await sb.from("pesagens").select("*").eq("fluxo_pesagem","complementar").eq("fechada",false).order("created_at",{ascending:false});
   if(qComp.error)return alert("Não foi possível conferir complementações anteriores: "+qComp.error.message);
   const comp=(qComp.data||[]).filter(x=>pesagemClienteNome(x).toLowerCase()===pessoa.toLowerCase());
   if(comp.length){grupoId=comp[0].grupo_ticket_id||String(comp[0].id);relacionadas=comp.filter(x=>String(x.grupo_ticket_id||x.id)===String(grupoId));}
 }
 if(!relacionadas.length)relacionadas=sameDay.filter(x=>!x.fechada && x.finalizada!==true);
 if(!grupoId){
   const existenteGrupo=sameDay.find(x=>x.grupo_ticket_id&&!x.fechada&&x.finalizada!==true);
   if(existenteGrupo){
     grupoId=existenteGrupo.grupo_ticket_id;
     const qGrupo=await sb.from("pesagens").select("*").eq("grupo_ticket_id",grupoId).eq("fechada",false);
     if(qGrupo.error)return alert("Não foi possível carregar o ticket agrupado: "+qGrupo.error.message);
     relacionadas=qGrupo.data||relacionadas;
   }
 }
 const numeroExistente=relacionadas.find(x=>Number(x.numero_ticket||0)>0)?.numero_ticket||sameDay.filter(x=>!x.fechada&&x.finalizada!==true).find(x=>Number(x.numero_ticket||0)>0)?.numero_ticket||null;
 if(fluxo==="complementar"&&!grupoId){grupoId=relacionadas.find(x=>x.grupo_ticket_id)?.grupo_ticket_id||String(relacionadas[0]?.id||"")||null;}
 const base={...row,fluxo_pesagem:fluxo,grupo_ticket_id:grupoId||null,fechada:false,finalizada:false};
 const {data:saved,error}=await sb.from("pesagens").insert(base).select().single();
 if(error)return alert("Não foi possível registrar a pesagem. Nenhum registro existente foi apagado.\n\n"+error.message);
 let novo=saved;
 const ticketNumero=numeroExistente||Number(saved.numero_ticket||0);
 const grupoFinal=fluxo==="complementar"?(grupoId||String(saved.id)):grupoId;
 const patchNovo={};
 if(grupoFinal && String(saved.grupo_ticket_id||"")!==String(grupoFinal))patchNovo.grupo_ticket_id=grupoFinal;
 if(ticketNumero && Number(saved.numero_ticket||0)!==Number(ticketNumero))patchNovo.numero_ticket=ticketNumero;
 if(Object.keys(patchNovo).length){
   const up=await sb.from("pesagens").update(patchNovo).eq("id",saved.id).select().single();
   if(up.error)return alert("A pesagem foi salva, mas o ticket precisa ser conferido: "+up.error.message);
   novo=up.data;
 }
 const idsRelacionados=[...new Set([...relacionadas.map(x=>String(x.id)),String(novo.id)])];
 if(fluxo==="complementar"){
   const upd=await sb.from("pesagens").update({fluxo_pesagem:"complementar",grupo_ticket_id:grupoFinal,fechada:false,finalizada:false,...(ticketNumero?{numero_ticket:ticketNumero}:{})}).in("id",idsRelacionados);
   if(upd.error)return alert("A pesagem foi salva, mas não consegui completar o agrupamento. Ela continua salva e pode ser corrigida: "+upd.error.message);
 }else if(fluxo==="registro"){
   const idsDia=[...new Set([...relacionadas.filter(x=>!x.fechada&&x.finalizada!==true).map(x=>String(x.id)),...sameDay.filter(x=>!x.fechada&&x.finalizada!==true).map(x=>String(x.id)),String(novo.id)])];
   const upd=await sb.from("pesagens").update({fluxo_pesagem:"registro",fechada:true,finalizada:false,...(ticketNumero?{numero_ticket:ticketNumero}:{})}).in("id",idsDia);
   if(upd.error)return alert("A pesagem foi salva, mas não consegui arquivá-la. Ela continua salva em aberto: "+upd.error.message);
 }else if(fluxo==="financeiro"){
   const idsDia=[...new Set([...relacionadas.map(x=>String(x.id)),...sameDay.filter(x=>!x.fechada&&x.finalizada!==true).map(x=>String(x.id)),String(novo.id)])];
   const upd=await sb.from("pesagens").update({fluxo_pesagem:"financeiro",finalizada:true,fechada:false,...(ticketNumero?{numero_ticket:ticketNumero}:{})}).in("id",idsDia);
   if(upd.error)return alert("A pesagem foi salva, mas não consegui prepará-la para o Financeiro. Ela continua salva em aberto: "+upd.error.message);
   await pesagensCloudLoad();
   await pesagemFinalizarCliente(pessoa,idsDia);
   return;
 }
 await pesagensCloudLoad();
 await pesagemRender();
 if(fluxo==="complementar")alert("Pesagem salva no ticket agrupado. Você pode adicionar mais pesos agora ou em outro dia.");
 if(fluxo==="registro")alert("Pesagem finalizada e enviada para a pasta Registros, sem gerar pagamento.");
}

 </div><br>
 <button class="btn primary" onclick="pesagemSalvarEdicao('${x.id}')">💾 Salvar alterações</button></div>`;
 document.body.appendChild(modal);
 const calc=()=>{const a=parseBR($("pe_entrada").value||"0"),b=parseBR($("pe_saida").value||"0"),t=$("pe_mov")?.value||"compra";$("pe_liquido").value=brNum(Math.max(0,pesagemLiquidoCalcular(a,b,t)));};

async function pesagemSalvarEdicao(id){
 const x=pesagensLoad().find(a=>String(a.id)===String(id));if(!x)return;
 const entrada=parseBR($("pe_entrada").value||"0"),saida=parseBR($("pe_saida").value||"0"),tipo_movimento=normalizarTipoOperacao($("pe_mov")?.value||"compra"),liquido=pesagemLiquidoCalcular(entrada,saida,tipo_movimento);
 if(entrada<=0||saida<0||liquido<=0)return alert("Confira os pesos.");
 if(tipo_movimento==="compra" && entrada<saida)return alert("Na compra, o peso de entrada deve ser maior ou igual ao peso de saída. Se for uma venda, selecione Venda.");
 const novo={data:$("pe_data").value||today(),pessoa:$("pe_pessoa").value.trim(),hora_entrada:$("pe_hora_entrada")?.value||null,hora_saida:$("pe_hora_saida")?.value||null,tipo_movimento,material:$("pe_material").value.trim(),entrada,saida,liquido,observacoes:$("pe_obs").value.trim(),updated_at:new Date().toISOString()};
 if(!novo.pessoa||!novo.material)return alert("Informe pessoa e material.");
 const {data,error}=await sb.from("pesagens").update(novo).eq("id",id).select().single();
 if(error)return alert("Não foi possível atualizar a pesagem: "+error.message);
 pesagemCloud=pesagemCloud.map(a=>String(a.id)===String(id)?data:a);pesagemCloudReady=true;

}

async function pesagemFinalizarCliente(nome, idsFiltro=null){
 const idsPermitidos=Array.isArray(idsFiltro)?new Set(idsFiltro.map(String)):null;
 const items=pesagensLoad().filter(x=>pesagemClienteAberta(x)&&pesagemClienteNome(x).toLowerCase()===String(nome).trim().toLowerCase()&&(!idsPermitidos||idsPermitidos.has(String(x.id))));
 if(!items.length)return alert("Não há pesagens abertas para este cliente.");
 const completas=items.filter(x=>normalizarTipoOperacao(x.tipo_movimento)!=="venda"&&Number(x.entrada||0)>0&&Number(x.saida||0)>=0&&Number(x.liquido||0)>0);
 const incompletas=items.filter(x=>normalizarTipoOperacao(x.tipo_movimento)!=="venda"&&!(Number(x.entrada||0)>0&&Number(x.saida||0)>=0&&Number(x.liquido||0)>0));
 const vendas=items.filter(x=>normalizarTipoOperacao(x.tipo_movimento)==="venda");
 if(!completas.length){
   let msg="Não há pesagens completas para enviar ao Financeiro.";
   if(incompletas.length)msg+=`\n\n${incompletas.length} pesagem(ns) ainda estão sem peso de saída ou peso líquido.`;
   if(vendas.length)msg+=`\n${vendas.length} venda(s) ficaram fora do Financeiro.`;
   return alert(msg);
 }
 const agora=new Date().toISOString();
 const ids=completas.map(x=>String(x.id));
 const numeroGrupo=completas.find(x=>Number(x.numero_ticket||0)>0)?.numero_ticket;
 const patchFinal={finalizada:true,fluxo_pesagem:"financeiro",updated_at:agora,...(numeroGrupo?{numero_ticket:numeroGrupo}:{})};
 const {data:finalizadas,error:finError}=await sb.from("pesagens").update(patchFinal).in("id",ids).select();
 if(finError)return alert("Não foi possível enviar as pesagens do cliente ao Financeiro: "+finError.message);
 const mapaFinal=new Map((finalizadas||[]).map(x=>[String(x.id),x]));
 pesagemCloud=pesagemCloud.map(x=>mapaFinal.has(String(x.id))?mapaFinal.get(String(x.id)):x);
 pesagemCloudReady=true;
 // Sincroniza em pequenos lotes paralelos para evitar esperar cada pesagem individualmente.
 // A função de sincronização verifica o lançamento existente antes de criar, evitando duplicidades.
 let falhas=0;
 const idsEnviadas=[];
 const lote=6;
 for(let i=0;i<completas.length;i+=lote){
   const grupo=completas.slice(i,i+lote);
   const resultados=await Promise.allSettled(grupo.map(async x=>{
     const atual=mapaFinal.get(String(x.id))||x;
     return {id:String(atual.id),resultado:await financeiroSincronizarPesagem({...atual,finalizada:true})};
   }));
   for(const r of resultados){
     if(r.status==="fulfilled"&&r.value.resultado)idsEnviadas.push(r.value.id);
     else {falhas++;if(r.status==="rejected")console.error("Financeiro após envio por cliente",r.reason);}
   }
 }
 if(falhas){
   await pesagemRender();
   return alert(`O cliente ${nome} foi processado, mas ${falhas} pesagem(ns) não foram enviadas ao Financeiro. Elas permanecerão abertas para nova tentativa.`);
 }
 // Mantém os tickets enviados ao Financeiro abertos na aba Pesagem; o pagamento é controlado no Financeiro.
 pesagemCloudReady=true;
 await pesagemRender();
}


async function pesagemMarcarComplementacao(nome,ids){
 const permitidos=(Array.isArray(ids)?ids:[]).map(String);
 let items=pesagensLoad().filter(x=>permitidos.includes(String(x.id))&&!x.fechada);
 if(!items.length)return alert("Não encontrei pesagens abertas neste ticket.");
 if(items.some(x=>x.finalizada===true))return alert("Este ticket já foi enviado ao Financeiro. Desfaça o envio antes de colocá-lo em complementação.");
 const grupo=items.find(x=>x.grupo_ticket_id)?.grupo_ticket_id||String(items[0].id);
 const numero=items.find(x=>Number(x.numero_ticket||0)>0)?.numero_ticket;
 const {error}=await sb.from("pesagens").update({fluxo_pesagem:"complementar",grupo_ticket_id:grupo,fechada:false,finalizada:false,...(numero?{numero_ticket:numero}:{})}).in("id",permitidos);
 if(error)return alert("Não foi possível agrupar a pesagem: "+error.message);
 await pesagensCloudLoad();await pesagemRender();
 alert("Ticket marcado como Aguardando complementação. As próximas pesagens só entrarão neste ticket se forem adicionadas por ele.");
}

async function pesagemArquivarGrupo(nome,ids){
 const permitidos=(Array.isArray(ids)?ids:[]).map(String);
 const items=pesagensLoad().filter(x=>permitidos.includes(String(x.id))&&!x.fechada);
 if(!items.length)return alert("Não encontrei pesagens abertas neste ticket.");
 if(items.some(x=>x.finalizada===true))return alert("Este ticket já foi enviado ao Financeiro. Não será arquivado como simples registro.");
 if(!confirm("Finalizar este ticket e enviar para Registros, sem criar pagamento no Financeiro?"))return;
 const numero=items.find(x=>Number(x.numero_ticket||0)>0)?.numero_ticket;
 const {error}=await sb.from("pesagens").update({fluxo_pesagem:"registro",fechada:true,finalizada:false,updated_at:new Date().toISOString(),...(numero?{numero_ticket:numero}:{})}).in("id",permitidos);
 if(error)return alert("Não foi possível arquivar o ticket: "+error.message);
 await pesagensCloudLoad();await pesagemRender();
}

async function pesagemFinalizar(id){
 const x=pesagensLoad().find(a=>String(a.id)===String(id));
 if(!x)return;
 if(normalizarTipoOperacao(x.tipo_movimento)==="venda")return alert("Pesagens de venda não entram no Financeiro.");
 const entrada=Number(x.entrada||0), saida=Number(x.saida||0), liquido=Number(x.liquido||0);
 if(!(entrada>0&&saida>0&&liquido>0))return alert("Esta pesagem ainda está incompleta. Informe o peso de saída antes de finalizar.");
 if(!confirm("Finalizar esta pesagem?\n\nEla será enviada para o Financeiro como uma compra pendente. O pagamento poderá ser feito junto com outras pesagens deste mesmo cliente."))return;
 const agora=new Date().toISOString();
 const {data,error}=await sb.from("pesagens").update({finalizada:true,updated_at:agora}).eq("id",id).select().single();
 if(error)return alert("Não foi possível finalizar a pesagem: "+error.message);
 pesagemCloud=pesagemCloud.map(a=>String(a.id)===String(id)?data:a);pesagemCloudReady=true;
 try{await financeiroSincronizarPesagem(data);}catch(e){console.error("Financeiro após finalização",e);return alert("A pesagem foi finalizada, mas não foi possível criar o lançamento no Financeiro. Abra o Financeiro para sincronizar.");}
 await pesagemRender();
 alert("Pesagem finalizada e enviada ao Financeiro.\n\nEla ficará disponível para pagamento junto com as demais pesagens deste cliente.");
}

async function pesagemExcluir(id){
 if(!confirm("Excluir esta pesagem?"))return;
 // Primeiro remove o lançamento financeiro vinculado, para que uma pesagem
 // excluída nunca continue aparecendo em Contas a pagar/Pagamentos realizados.
 const {error:finError}=await sb.from("financeiro_pesagens").delete().eq("pesagem_id",id);
 if(finError){
   console.error("Erro ao remover vínculo financeiro",finError);
   return alert("Não foi possível excluir a pesagem do Financeiro: "+finError.message);
 }
 const {error}=await sb.from("pesagens").delete().eq("id",id);
 if(error)return alert("Não foi possível excluir a pesagem: "+error.message);
 pesagemCloud=pesagemCloud.filter(x=>String(x.id)!==String(id));pesagemCloudReady=true;
 financeiroCloud=(financeiroCloud||[]).filter(x=>String(x.pesagem_id)!==String(id));
 await pesagemRender();
}

async function pesagemExcluirCliente(nome,ids,arquivada=false){

 const qtd=lista.length;
 if(!qtd)return alert("Não há pesagens para excluir.");

 if(!confirm(`Excluir TODAS as ${qtd} pesagens ${tipo} de ${nome}?\n\nEssa ação não poderá ser desfeita.`))return;
 // Remove também os lançamentos financeiros vinculados às pesagens excluídas.

 if(finError){
   console.error("Erro ao remover vínculos financeiros",finError);
   return alert("Não foi possível excluir as pesagens do Financeiro: "+finError.message);
 }
 const {error}=await sb.from("pesagens").delete().in("id",ids);
 if(error)return alert("Não foi possível excluir as pesagens: "+error.message);
 const set=new Set(ids.map(String));
 pesagemCloud=pesagemCloud.filter(x=>!set.has(String(x.id)));pesagemCloudReady=true;
 financeiroCloud=(financeiroCloud||[]).filter(x=>!set.has(String(x.pesagem_id)));
 await pesagemRender();
 alert(`${qtd} pesagem(ns) de ${nome} excluída(s) com sucesso.`);
}

function pesagemImprimirDia(data){

async function financeiroSincronizarPesagem(p, userId=null, observacaoExtra=null){
 // Somente COMPRA do dia vai para o contas a pagar. Vendas ficam fora do Financeiro.
 if(!p || normalizarTipoOperacao(p.tipo_movimento)==="venda") return null;
 if(p.finalizada!==true || String(p.fluxo_pesagem||"")!=="financeiro")return null;
 const uid=userId || p.user_id || (await sb.auth.getUser()).data?.user?.id;
 if(!uid)return null;
 const {data:existente,error:buscaError}=await sb.from("financeiro_pesagens").select("*").eq("pesagem_id",p.id).maybeSingle();
 if(buscaError){console.error("financeiro busca pesagem",buscaError);return null;}
 const prod=financeiroMaterialProduto(p.material);
 const preco=existente?.preco_kg!=null?Number(existente.preco_kg):(prod&&Number(prod.preco)>0?Number(prod.preco):null);
 const total=preco?Number(p.liquido||0)*preco:0;
 const base={pesagem_id:p.id,user_id:uid,pessoa:p.pessoa||"Cliente não informado",data:p.data||today(),material:p.material||"Não informado",liquido:Number(p.liquido||0),preco_kg:preco,total,observacoes:observacaoExtra||p.observacoes||null,updated_at:new Date().toISOString()};
 if(existente){
   if(String(existente.status)==="Pendente"){
     const up=await sb.from("financeiro_pesagens").update(base).eq("id",existente.id).select().single();
     if(up.error)console.error("financeiro atualização",up.error);
     return up.data||existente;
   }
   return existente;
 }
 const ins=await sb.from("financeiro_pesagens").insert({...base,status:"Pendente"}).select().single();
 if(ins.error && ins.error.code!=="23505")console.error("Erro ao criar financeiro",ins.error);
 return ins.data||null;
}

 }
 const {data,error}=await sb.from("financeiro_pesagens").select("*").order("data",{ascending:false}).order("created_at",{ascending:false});
 if(error){console.error("financeiro_pesagens",error);return financeiroCloud||[];}
 let lista=data||[];
 // Não removemos lançamentos financeiros já existentes automaticamente; isso preserva o histórico.
 // Limpeza de segurança: se uma pesagem foi excluída, seu lançamento financeiro
 // também desaparece, inclusive se a exclusão ocorreu por outro caminho da Pesagem.
 const idsPesagensAtuais=new Set((pesagensLoad()||[]).map(p=>String(p.id)));
 const financeiroOrfaos=lista.filter(f=>f.pesagem_id && !idsPesagensAtuais.has(String(f.pesagem_id)));
 if(financeiroOrfaos.length){
   const idsOrfaos=financeiroOrfaos.map(f=>String(f.id));
   const delOrfaos=await sb.from("financeiro_pesagens").delete().in("id",idsOrfaos);
   if(delOrfaos.error) console.error("Não foi possível limpar pagamentos de pesagens excluídas",delOrfaos.error);
   else lista=lista.filter(f=>!idsOrfaos.includes(String(f.id)));
 }
 const byPesagem=new Map(lista.map(x=>[String(x.pesagem_id),x]));
 const faltantes=[];
 for(const p of compras){
   if(byPesagem.has(String(p.id)))continue;
   const prod=financeiroMaterialProduto(p.material);
   const preco=prod&&Number(prod.preco)>0?Number(prod.preco):null;
   faltantes.push({pesagem_id:p.id,pessoa:p.pessoa||"Cliente não informado",data:p.data||hojeLocal,material:p.material||"Não informado",liquido:Number(p.liquido||0),preco_kg:preco,total:preco?Number(p.liquido||0)*preco:0,status:"Pendente",observacoes:p.observacoes||null});
 }
 if(faltantes.length){
   const ins=await sb.from("financeiro_pesagens").insert(faltantes).select();
   if(!ins.error)lista=[...(ins.data||[]),...lista]; else console.error("financeiro insert",ins.error);
 }
 // Só atualiza lançamentos pendentes quando algum dado realmente mudou.
 const comprasMap=new Map(compras.map(x=>[String(x.id),x]));
 const updates=[];
 for(const f of lista){
   if(f.status!=="Pendente")continue;
   const p=comprasMap.get(String(f.pesagem_id));
   if(!p)continue;
   const patch={};
   const pessoa=p.pessoa||f.pessoa;
   const data=p.data||f.data;
   const material=p.material||f.material;
   const liquido=Number(p.liquido||0);
   if(String(f.pessoa||"")!==String(pessoa||""))patch.pessoa=pessoa;
   if(String(f.data||"")!==String(data||""))patch.data=data;
   if(String(f.material||"")!==String(material||""))patch.material=material;
   if(Number(f.liquido||0)!==liquido)patch.liquido=liquido;
   let preco=f.preco_kg;
   if(preco===null||preco===undefined){
     const prod=financeiroMaterialProduto(material);
     if(prod&&Number(prod.preco)>0){preco=Number(prod.preco);patch.preco_kg=preco;patch.total=liquido*preco;}
   }else{
     const total=liquido*Number(preco||0);
     if(Number(f.total||0)!==total)patch.total=total;
   }
   if(Object.keys(patch).length){
     patch.updated_at=new Date().toISOString();
     updates.push({id:f.id,patch});
     Object.assign(f,patch);
   }
 }
 // Faz somente as atualizações necessárias. Antes, cada abertura do Financeiro
 // atualizava novamente todos os lançamentos pendentes.
 // Atualiza apenas os lançamentos que mudaram, em paralelo, para reduzir a espera ao abrir o Financeiro.
 if(updates.length){
   const resultados=await Promise.allSettled(updates.map(u=>sb.from("financeiro_pesagens").update(u.patch).eq("id",u.id)));
   resultados.forEach((r,i)=>{
     if(r.status==="rejected")console.error("financeiro update",r.reason);
     else if(r.value?.error)console.error("financeiro update",r.value.error);
   });
 }
 // Vendas nunca entram nas contas a pagar.
 const pesMap=new Map((pesagensLoad()||[]).map(p=>[String(p.id),p]));
 lista=lista.filter(f=>{
   const p=pesMap.get(String(f.pesagem_id));
   return !p||String(p.tipo_movimento||"compra").toLowerCase()!=="venda";
 });
 // Pagamentos antigos permanecem pendentes até alguém registrar o pagamento manualmente.
 financeiroCloud=lista;
 return financeiroCloud;
}

function financeiroGrupos(lista){

 });
}

function financeiroPixCRC16(payload){let crc=0xFFFF;for(let i=0;i<payload.length;i++){crc^=payload.charCodeAt(i)<<8;for(let j=0;j<8;j++)crc=(crc&0x8000)?((crc<<1)^0x1021)&0xFFFF:(crc<<1)&0xFFFF;}return crc.toString(16).toUpperCase().padStart(4,"0");}
function financeiroPixField(id,value){value=String(value||"");return String(id).padStart(2,"0")+String(value.length).padStart(2,"0")+value;}
function financeiroPixPayload(chave,nome,cidade,valor){
 const k=String(chave||"").trim(), n=String(nome||"Cliente").normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").replace(/[^A-Za-z0-9 .&\\-]/g,"").slice(0,25)||"CLIENTE";
 const c=String(cidade||"OSASCO").normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").replace(/[^A-Za-z0-9 .&\\-]/g,"").slice(0,15)||"OSASCO";
 if(!k)return "";
 let mai=financeiroPixField(00,"br.gov.bcb.pix")+financeiroPixField(01,k);
 let body=financeiroPixField(00,"01")+financeiroPixField(26,mai)+financeiroPixField(52,"0000")+financeiroPixField(53,"986");
 if(Number(valor)>0)body+=financeiroPixField(54,Number(valor).toFixed(2));
 body+=financeiroPixField(58,"BR")+financeiroPixField(59,n)+financeiroPixField(60,c)+financeiroPixField(62,financeiroPixField(05,"***"));
 return body+"6304"+financeiroPixCRC16(body+"6304");
}

 }

async function financeiroExcluirPagamento(id){
 const row=(financeiroCloud||[]).find(x=>String(x.id)===String(id));
 if(!row)return alert("Pagamento não encontrado.");
 if(await financeiroDataFechada(String(row.data||today())))return alert("O caixa desse dia está fechado. Reabra o caixa antes de excluir o pagamento.");
 if(!confirm("Excluir este pagamento definitivamente?\n\nO registro sairá de Pagamentos realizados e a pesagem voltará a ficar disponível para pagamento."))return;
 const agora=new Date().toISOString();
 // Se houve abatimento de adiantamento, devolve o valor ao saldo do adiantamento.
 const desconto=Math.max(0,Number(row.desconto_adiantamento||0));
 if(row.adiantamento_id && desconto>0){
   const {data:ad,error:adError}=await sb.from("adiantamentos").select("*").eq("id",row.adiantamento_id).single();
   if(adError||!ad)return alert("Não foi possível localizar o adiantamento para devolver o desconto. O pagamento não foi excluído.");
   let abatimentos=Array.isArray(ad.abatimentos)?[...ad.abatimentos]:[];
   let restante=desconto;
   for(let i=abatimentos.length-1;i>=0&&restante>0;i--){
     const v=Math.max(0,Number(abatimentos[i]?.valor||0));
     if(v<=0)continue;
     const retirar=Math.min(v,restante);
     const novo=v-retirar;
     if(novo<=0)abatimentos.splice(i,1);
     else abatimentos[i]={...abatimentos[i],valor:novo};
     restante-=retirar;
   }
   if(restante>0)return alert("Não foi possível identificar todo o abatimento do adiantamento. O pagamento não foi excluído para evitar divergência no saldo.");
   const {error:adUpdateError}=await sb.from("adiantamentos").update({abatimentos,updated_at:agora}).eq("id",ad.id);
   if(adUpdateError)return alert("Não foi possível devolver o abatimento ao adiantamento: "+adUpdateError.message);
 }
 const {error:delError}=await sb.from("financeiro_pesagens").delete().eq("id",id);
 if(delError)return alert("Não foi possível excluir o pagamento: "+delError.message);
 // Reabre a pesagem para que ela volte ao fluxo de pagamento.
 if(row.pesagem_id){
   const {error:pesError}=await sb.from("pesagens").update({fechada:false,finalizada:true,updated_at:agora}).eq("id",row.pesagem_id);
   if(pesError)console.error("Pagamento excluído, mas não consegui reabrir a pesagem",pesError);
   pesagemCloud=(pesagemCloud||[]).map(p=>String(p.id)===String(row.pesagem_id)?{...p,fechada:false,finalizada:true,updated_at:agora}:p);
 }
 financeiroCloud=(financeiroCloud||[]).filter(x=>String(x.id)!==String(id));
 try{await adLoad(true)}catch(e){}
 await financeiroRender();
 alert("Pagamento excluído. A pesagem voltou para o fluxo de pagamento.");
}

let financeiroRealtimeReady=false;
let financeiroRealtimeTimer=null;
function iniciarFinanceiroRealtime(){
 if(financeiroRealtimeReady||!sb)return;
 financeiroRealtimeReady=true;
 const agendarAtualizacao=()=>{
   if(financeiroRealtimeTimer)clearTimeout(financeiroRealtimeTimer);
   financeiroRealtimeTimer=setTimeout(async()=>{
     const tela=$("financeiro");
     if(!tela||!tela.classList.contains("active"))return;
     // Não apaga o que estiver sendo digitado; atualiza assim que a pessoa sair do campo.
     const ativo=document.activeElement;
     if(ativo&&tela.contains(ativo)&&["INPUT","SELECT","TEXTAREA"].includes(ativo.tagName))return;
     try{await financeiroRender();}catch(e){console.error("Atualização automática do Financeiro",e);}
   },700);
 };
 sb.channel("financeiro-atualizacao-automatica")
   .on("postgres_changes",{event:"*",schema:"public",table:"financeiro_pesagens"},agendarAtualizacao)
   .on("postgres_changes",{event:"*",schema:"public",table:"pesagens"},agendarAtualizacao)
   .on("postgres_changes",{event:"*",schema:"public",table:"produtos_pesagem"},agendarAtualizacao)
   .on("postgres_changes",{event:"*",schema:"public",table:"financeiro_fechamentos"},agendarAtualizacao)
   .subscribe((status)=>{if(status==="CHANNEL_ERROR")console.warn("Realtime do Financeiro indisponível; confira se as tabelas estão habilitadas no Supabase Realtime.");});
 // Se uma alteração chegar enquanto havia um campo em edição, atualiza quando ele perder o foco.
 document.addEventListener("focusout",(e)=>{
   const tela=$("financeiro");
   if(!tela||!tela.classList.contains("active")||!e.target||!tela.contains(e.target)||!["INPUT","SELECT","TEXTAREA"].includes(e.target.tagName))return;
   // Não renderiza novamente ao sair dos campos de preço: isso poderia apagar
   // o valor digitado antes de o clique no botão Salvar concluir.
   const id=String(e.target.id||"");
   if(id.startsWith("finpreco_")||id.startsWith("finmatpreco_"))return;
   agendarAtualizacao();
 });
}

function logEsc(v){return esc(v||"");}
function logNorm(v){return String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();}
function logTokens(v){return [...new Set(logNorm(v).split(/\s+/).filter(x=>x.length>=4))];}
function logDateBR(v){return v?osDataBRPrint(v):"";}
function logTipoLabel(t){return {entrega:"Entregar caçamba",retirada:"Retirar caçamba",final:"Levar à empresa final",busca:"Buscar material",ponto:"Parada/compromisso"}[t]||t;}

function logClienteEndereco(id){const c=(cache.clientes||[]).find(x=>String(x.id)===String(id));if(!c)return "";return [c.endereco,c.numero,c.bairro,c.cidade,c.estado,c.cep].filter(Boolean).join(", ");}
function logScore(a,b){
 const A=logTokens(a),B=logTokens(b); if(!A.length||!B.length)return 0;
 let common=A.filter(x=>B.includes(x));
 let score=common.length*20;
 if(logNorm(a)===logNorm(b))score+=100;
 if(common.some(x=>["osasco","barueri","carapicuiba","cotia","taboao","jandira","itapevi","sao","paulo"].includes(x)))score+=15;
 return Math.min(100,score);
}
function logProximidadeLabel(score){if(score>=60)return "🟢 Forte oportunidade de combinar";if(score>=35)return "🟡 Pode valer combinar";return "⚪ Pouca evidência de proximidade";}
function logPriorityWeight(p){return ({Urgente:40,Alta:25,Normal:10,Baixa:0}[p]??10);}
function logGerarEstrategia(){
 const date=logState.date||dataHojeISO();
 const itens=logState.items.filter(x=>!x.date||x.date===date).map((x,i)=>({...x,_i:i}));
 const usados=new Set(),rotas=[];
 const ordemItems=itens.filter(x=>x.sourceOSId).map(x=>{const o=(cache.ordens||[]).find(z=>String(z.id)===String(x.sourceOSId));return o?{...x,os:o}:x});
 // 1) Primeiro agrupa retirada + empresa final quando há endereço/região parecida.
 for(const it of itens){
  if(usados.has(it._i))continue;
  if(it.tipo!=="retirada")continue;
  let melhor=null,best=-1;
  for(const fin of itens){
   if(usados.has(fin._i)||fin._i===it._i||fin.tipo!=="final")continue;
   const sc=logScore(it.endereco,fin.endereco);
   if(sc>best){best=sc;melhor=fin;}
  }
  const par=[it]; if(melhor&&best>=25){par.push(melhor);usados.add(melhor._i);}
  usados.add(it._i);
  rotas.push({name:"Rota sugerida "+(rotas.length+1),patio:it.patio||"Analice",items:par,reason:melhor?`${logProximidadeLabel(best)} entre a retirada e a empresa final (${best}% de compatibilidade por endereço/região).`:`Retirada prioritária; sem empresa final próxima informada.`,score:best});
 }
 // 2) Agrupa entregas restantes por endereço/região e prioridade.
 for(const it of itens){
  if(usados.has(it._i))continue;
  const grupo=[it];usados.add(it._i);
  for(const cand of itens){if(usados.has(cand._i))continue;if(cand.tipo!==it.tipo&&it.tipo!=="entrega"&&cand.tipo!=="entrega")continue;const sc=logScore(it.endereco,cand.endereco);if(sc>=35){grupo.push(cand);usados.add(cand._i);}}
  grupo.sort((a,b)=>logPriorityWeight(b.prioridade)-logPriorityWeight(a.prioridade));
  rotas.push({name:"Rota sugerida "+(rotas.length+1),patio:it.patio||"Analice",items:grupo,reason:grupo.length>1?"Serviços com endereços/regiões semelhantes foram agrupados para reduzir deslocamentos.":"Serviço isolado ou sem outra parada suficientemente próxima.",score:0});
 }
 // 3) Ordena rotas por prioridade e horário.

async 
const HIST_CACAMBA_KEY="sucatas_analice_cacamba_history_v2";
function histAll(){try{return JSON.parse(localStorage.getItem(HIST_CACAMBA_KEY)||"{}")}catch(e){return {}}}
function histSave(h){localStorage.setItem(HIST_CACAMBA_KEY,JSON.stringify(h))}
function historicoCacamba(cacamba){
  if(!cacamba)return '<span class="small">Anterior: — | Atual: —</span>';
  const anterior=cacamba.cliente_anterior_nome||"—";
  const atual=(cache.clientes||[]).find(x=>String(x.id)===String(cacamba.cliente_id))?.nome || (cacamba.cliente_id?"—":"Disponível");
  if(!cacamba.cliente_anterior_nome && !cacamba.ultima_troca_at) return '<span class="small">Anterior: — | Atual: '+esc(atual)+'</span>';
  return '<span class="small">Anterior: <b>'+esc(anterior)+'</b> | Atual: <b>'+esc(atual)+'</b>'+
    (cacamba.ultima_troca_at?'<br>Última troca: '+dataBR(cacamba.ultima_troca_at):'')+'</span>';
}
function registrarHistoricoTroca(cacambaId,clienteAnterior,clienteAtual){
  if(!cacambaId)return;
  const cac=(cache.cacambas||[]).find(c=>String(c.id)===String(cacambaId));
  const anteriorNome=clienteAnterior?.nome || cac?.cliente_anterior_nome || null;
  const anteriorId=clienteAnterior?.id || cac?.cliente_id || null;
  const now=new Date().toISOString();
  if(cac){
    cac.cliente_anterior_id=anteriorId;
    cac.cliente_anterior_nome=anteriorNome;
    cac.ultima_troca_at=now;
  }
  const h=histAll();
  h[String(cacambaId)]={anterior_id:anteriorId,anterior_nome:anteriorNome,atual_id:clienteAtual?.id||null,atual_nome:clienteAtual?.nome||null,data:now,numero:cac?.numero||clienteAtual?.numero||null};
  histSave(h);
}
function historicoCliente(clienteId){
  const itens=(cache.cacambas||[]).filter(c=>String(c.cliente_id)===String(clienteId));
  if(!itens.length)return '<span class="small">—</span>';
  return itens.map(c=>'<div style="margin-bottom:4px"><b>Caçamba '+esc(c.numero||"")+'</b><br>'+historicoCacamba(c)+'</div>').join('');
}
function renderHistoricoCacambas(){
 const el=$("cacambaHistoricoRapido");if(!el)return;
 const grupos=[...(cache.cacambas||[])].sort((a,b)=>(Number(a.numero)||0)-(Number(b.numero)||0));
 el.innerHTML=grupos.map(c=>'<div class="quick-history"><b>Caçamba '+esc(c.numero||"")+'</b> '+historicoCacamba(c)+'</div>').join("")||'<p class="small">Nenhuma caçamba cadastrada.</p>';
}

async function addMov(){
 if(!val("vc"))return alert("Selecione a caçamba.");
 const cacAtual=(cache.cacambas||[]).find(c=>String(c.id)===String(val("vc")));
 const novoClienteId=val("vcl")||null;
 const clienteAnteriorId=cacAtual?.cliente_id||null;
 const clienteAnterior=(cache.clientes||[]).find(c=>String(c.id)===String(clienteAnteriorId))||null;
 const clienteAtual=(cache.clientes||[]).find(c=>String(c.id)===String(novoClienteId))||null;
 const row={tipo:val("vt"),cacamba_id:val("vc"),cliente_id:novoClienteId,caminhao_id:val("vcm")||null,motorista_id:val("vmo")||null,endereco:val("ve"),material:val("vma"),observacoes:val("vo")};
 if(["Entrega","Troca","Transferência"].includes(row.tipo) && !row.cliente_id)return alert("Para entregar ou trocar a caçamba, selecione o cliente.");
 const {error}=await sb.from("movimentacoes").insert(row).select().single();
 if(error)return alert(error.message);
 const updates={};
 if(["Entrega","Troca","Transferência"].includes(row.tipo)){
   updates.status="No cliente";updates.cliente_id=row.cliente_id;updates.endereco_atual=row.endereco||null;updates.caminhao_id=row.caminhao_id;updates.motorista_id=row.motorista_id;updates.material=row.material||null;
 }
 if(["Retirada","Entrada no pátio"].includes(row.tipo)){
   updates.status="No pátio";updates.cliente_id=null;updates.endereco_atual=null;updates.caminhao_id=null;updates.motorista_id=null;updates.data_colocacao=null;updates.material=null;
 }
 if(row.tipo==="Saída do pátio"){
   updates.status="Disponível";updates.cliente_id=null;updates.endereco_atual=null;updates.caminhao_id=null;updates.motorista_id=null;updates.data_colocacao=null;updates.material=null;updates.patio=null;
 }
 const {data:updated,error:updateError}=await sb.from("cacambas").update(updates).eq("id",row.cacamba_id).select().single();
 if(updateError)return alert(updateError.message);
 if(["Entrega","Troca","Transferência"].includes(row.tipo) && String(clienteAnteriorId)!==String(row.cliente_id)){
   registrarHistoricoTroca(row.cacamba_id,clienteAnterior,clienteAtual);
   const hUpdate={cliente_anterior_id:clienteAnteriorId||null,cliente_anterior_nome:clienteAnterior?.nome||cacAtual?.cliente_anterior_nome||null,ultima_troca_at:new Date().toISOString()};
   await sb.from("cacambas").update(hUpdate).eq("id",row.cacamba_id);
 }
 await loadAll();movimentacoes();cacambas();alert("Movimentação registrada!");
}

function manutencoes(){
 $("manutencoes").innerHTML=`<h2>🔧 Manutenção</h2><div class="card"><h3>Nova manutenção de caçamba</h3><div class="grid"><div><label>Caçamba</label><select id="mcac">${options(cache.cacambas,"id","numero")}</select></div><div><label>Data</label><input id="mdata" type="date" value="${today()}"></div><div><label>Problema *</label><input id="mprob"></div><div><label>Custo</label><input id="mcusto" type="number" step="0.01"></div><div><label>Status</label><select id="mstatus"><option>Aberta</option><option>Em andamento</option><option>Concluída</option></select></div><div><label>Observações</label><input id="mob"></div></div><br><button class="btn primary" onclick="addMan()">Registrar manutenção</button></div><div class="card tablewrap" id="manlist"></div>`;
 load("manutencoes").then(rows=>{
 $("manlist").innerHTML=`<table><tr><th>Data</th><th>Caçamba</th><th>Problema</th><th>Custo</th><th>Status</th><th>Ação</th></tr>${rows.map(x=>`<tr><td>${esc(dataBR(x.data))}</td><td>${esc(cache.cacambas.find(c=>c.id===x.cacamba_id)?.numero||"")}</td><td>${esc(x.problema)}</td><td>R$ ${Number(x.custo||0).toFixed(2)}</td><td>${esc(x.status)}</td><td><button class="btn" onclick="editRecord('manutencoes','${x.id}')">✏️</button> <button class="btn danger" onclick="delRow('manutencoes','${x.id}',manutencoes)">🗑️</button><button class="btn secondary no-print" onclick="imprimirItem('manutencoes','${x.id}')">🖨️</button></td></tr>`).join("")}</table>`;
 }).catch(e=>$("manlist").innerHTML=esc(e.message));
}
async function addMan(){
 if(!val("mcac")||!val("mprob"))return alert("Selecione a caçamba e informe o problema.");
 const {error}=await sb.from("manutencoes").insert({cacamba_id:val("mcac"),data:val("mdata")||today(),problema:val("mprob"),custo:Number($("mcusto").value||0),status:val("mstatus"),observacoes:val("mob")});
 if(error)return alert(error.message);
 await sb.from("cacambas").update({status:"Manutenção"}).eq("id",val("mcac"));
 await loadAll();manutencoes();alert("Manutenção registrada!");
}

async function openSignup(){
  const nome=prompt("Digite seu nome:");
  if(!nome) return;
  const email=prompt("Digite seu e-mail:");
  if(!email) return;
  const senha=prompt("Crie sua senha (mínimo recomendado: 8 caracteres):");
  if(!senha) return;
  if(senha.length<6){ alert("A senha precisa ter pelo menos 6 caracteres."); return; }
  const confirm=prompt("Digite a senha novamente:");
  if(senha!==confirm){ alert("As senhas não conferem."); return; }
  const {data,error}=await sb.auth.signUp({email:email.trim(),password:senha,options:{data:{nome:nome.trim()}}});
  if(error){ alert(error.message); return; }
  alert("Conta criada! Se o Supabase solicitar confirmação por e-mail, confirme o endereço e depois entre no sistema. O novo usuário deve ser aprovado/ajustado pelo administrador.");
}

async function forgotPassword(){
  const email=prompt("Digite o e-mail cadastrado:");
  if(!email) return;
  const redirect=location.origin+location.pathname;
  const {error}=await sb.auth.resetPasswordForEmail(email.trim(),{redirectTo:redirect});
  if(error){ alert(error.message); return; }
  alert("Enviamos o link de redefinição de senha para seu e-mail.");
}
